<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bravais 原型</title>
<!-- Bravais suite 交互原型：翻牌墙 + 墙面裂缝信息条；假数据、单文件、不依赖构建。设计见 bravais 设计稿（不在仓库里） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700;800&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --wall: #1c1c1f;
    --wall-frame: rgba(255, 255, 255, 0.045);
    --paper: #eeede8;
    --ink: #1a1a1a;
    --ink-soft: #6b6b68;
    --accent: #f4e04d;
    --accent-ink: #2b2600;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--wall); color: #fff;
    font-family: "Noto Sans JP", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }

#stage { position: fixed; inset: 0; touch-action: none; user-select: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
.half { position: absolute; top: 0; bottom: 0; overflow: hidden; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

.tile { position: absolute; contain: layout paint; }
.tile-inner { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; transform-origin: 50% 50%;
    background: hsl(var(--h) 30% 24%); box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.cover { position: absolute; inset: 0;
    background:
        radial-gradient(120% 90% at 78% 12%, hsl(calc(var(--h) + 30) 70% 72% / .55), transparent 60%),
        linear-gradient(160deg, hsl(var(--h) 52% 50%), hsl(calc(var(--h) + 40) 45% 18%)); }
.glyph { position: absolute; right: -.06em; bottom: -.18em; font-family: "Noto Serif JP", serif; font-weight: 900;
    line-height: 1; color: rgba(255,255,255,.16); pointer-events: none; }
.kind-artist .cover::after { content: ""; position: absolute; left: 50%; top: 40%; width: 46%; aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, hsl(var(--h) 40% 80%), hsl(var(--h) 35% 32%)); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.62), transparent 58%); }
.badge { position: absolute; left: 18px; top: 16px; padding: 4px 9px; border-radius: 3px; font-size: 17px; font-weight: 800;
    letter-spacing: .12em; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.6); color: rgba(255,255,255,.85); }
.copy { position: absolute; left: 20px; right: 20px; bottom: 18px; }
.copy .t { font-weight: 900; line-height: .98; letter-spacing: -.04em; text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.copy .a { margin-top: .35em; opacity: .78; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile:not(.is-wall):hover .tile-inner { filter: brightness(1.12); }
.is-playing .tile-inner { box-shadow: inset 0 0 0 4px var(--accent), 0 10px 28px rgba(0,0,0,.35); }
.is-playing .badge { background: var(--accent); color: var(--accent-ink); }
.is-wall .tile-inner { background: transparent; box-shadow: inset 0 0 0 2px var(--wall-frame); }
.is-wall .wall-rank { position: absolute; left: 14px; top: 10px; font-size: 22px; font-weight: 700; color: rgba(255,255,255,.14);
    font-variant-numeric: tabular-nums; }

/* 裂缝 */
#seam { position: absolute; top: 0; bottom: 0; overflow: hidden; background: var(--paper); color: var(--ink);
    box-shadow: 0 0 22px rgba(0,0,0,.5), 0 0 4px rgba(0,0,0,.35); z-index: 5; cursor: default; }
#seam.closed { visibility: hidden; }
.seam-inner { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column;
    padding: 22px 22px 20px; gap: 14px; transform-origin: 50% 50%; }
.crumbs { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 28px; }
.crumbs .back { border: 1px solid rgba(0,0,0,.18); background: none; border-radius: 999px; width: 28px; height: 28px; display: grid; place-items: center;
    font-size: 16px; margin-right: 4px; }
.vtitle-wrap { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; overflow: hidden; }
.vtitle { writing-mode: vertical-rl; font-family: "Noto Serif JP", serif; font-weight: 700; line-height: 1.25; letter-spacing: .06em;
    max-height: 100%; }
.quote { font-family: "Noto Serif JP", serif; font-size: 28px; line-height: .6; color: var(--ink); }
.rule { height: 1px; background: rgba(0,0,0,.14); flex: none; }
.meta { font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
.meta strong { color: var(--ink); font-weight: 700; }
.bio { font-size: 12px; line-height: 1.7; color: #3d3d3a; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button { border: 1px solid rgba(0,0,0,.16); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
.actions button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.input-slot input { width: 100%; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 8px 2px; font: inherit;
    font-size: 14px; color: var(--ink); outline: none; }
.input-slot input::placeholder { color: #9a9993; }
/* 窄缝（首页） */
.seam-inner.narrow { align-items: center; padding: 22px 10px; gap: 18px; }
.narrow .vtitle { font-size: 40px; }
.vtabs { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.vtabs button { writing-mode: vertical-rl; border: 0; background: none; padding: 10px 4px; font-size: 14px; font-weight: 700; letter-spacing: .2em;
    color: var(--ink-soft); border-radius: 4px; }
.vtabs button.on { color: var(--ink); background: rgba(0,0,0,.07); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); background: none; display: grid; place-items: center; font-size: 16px; }

/* 浮层 UI */
.ui { position: fixed; z-index: 20; }
#floating-back { left: 20px; top: 20px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px); font-size: 20px; display: none; }
#seam-tab { top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; border: 0; padding: 14px 8px; background: var(--paper);
    color: var(--ink); font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 13px; letter-spacing: .12em; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); max-height: 60vh; overflow: hidden; }
#seam-tab.left { left: 0; border-radius: 0 6px 6px 0; }
#seam-tab.right { right: 0; border-radius: 6px 0 0 6px; }
.seam-inner.spine { align-items: center; padding: 16px 8px; gap: 12px; }
.spine .spine-title { cursor: pointer; letter-spacing: .1em; }
.spine-count { writing-mode: vertical-rl; font-size: 11px; color: var(--ink-soft); letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.crumbs .lvl { border: 1px solid rgba(0,0,0,.16); background: none; border-radius: 999px; padding: 3px 9px; font-size: 11px; color: var(--ink-soft); }
.icon-btn.sm { width: 36px; height: 36px; font-size: 14px; flex: none; }
#fakebar { left: 50%; bottom: 32px; transform: translateX(-50%); width: min(512px, calc(100vw - 120px)); height: 64px; border-radius: 22px;
    background: rgba(24,24,27,.86); backdrop-filter: blur(16px); box-shadow: 0 16px 40px rgba(0,0,0,.45); padding: 10px 16px; z-index: 25;
    display: flex; flex-direction: column; justify-content: center; gap: 8px; pointer-events: none; }
#fakebar.off { display: none; }
.fb-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.fb-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; font-size: 11px; }
.fb-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.fb-progress { height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); }
.fb-progress span { display: block; width: 38%; height: 100%; border-radius: 2px; background: #fff; }
.seam-inner.panel { gap: 10px; }
.pnl-title { font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 26px; line-height: 1.2; }
.pnl-tools { display: flex; gap: 8px; align-items: center; }
.pnl-tools .input-slot { flex: 1; }
.pnl-sort { border: 1px solid rgba(0,0,0,.18); background: transparent; border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 12px; color: var(--ink); }
.pnl-dir { border: 1px solid rgba(0,0,0,.18); background: none; border-radius: 6px; width: 30px; height: 30px; color: var(--ink); }
.pnl-list { flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0 -8px; padding: 0 4px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.row:hover, .row.hot { background: rgba(0,0,0,.06); }
.row.playing .r-t { color: #8a6d00; }
.r-idx { width: 22px; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.r-t { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-a { font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-d { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pnl-empty { padding: 20px 8px; font-size: 12px; color: var(--ink-soft); }
.trow { display: flex; align-items: center; gap: 6px; padding-top: 5px; padding-bottom: 5px; padding-right: 8px; border-radius: 8px; font-size: 13px; }
.trow:hover { background: rgba(0,0,0,.05); }
.t-caret { width: 16px; text-align: center; color: var(--ink-soft); cursor: pointer; }
.t-box { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid rgba(0,0,0,.35); display: grid; place-items: center; font-size: 11px; font-weight: 900; cursor: pointer; flex: none; }
.t-box.all, .t-box.partial { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.t-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.t-count { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pnl-foot { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(0,0,0,.12); padding-top: 10px; }
.is-linked .tile-inner { box-shadow: inset 0 0 0 4px #fff, 0 0 0 2px rgba(255,255,255,.5), 0 10px 28px rgba(0,0,0,.35); }
.is-selected .tile-inner { box-shadow: inset 0 0 0 4px var(--accent), 0 10px 28px rgba(0,0,0,.35); }
.is-selected .tile-inner::after { content: "✓"; position: absolute; right: 14px; top: 12px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 18px; font-weight: 900; }
.tile-inner { transition: filter .3s, opacity .3s; }
#stage.batch-mode .tile:not(.is-wall):not(.is-selected) .tile-inner { filter: grayscale(1); opacity: .35; }
.is-focused .tile-inner { box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.f-links { margin-top: .6em; font-size: 22px; font-weight: 700; opacity: .9; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.f-links i { font-style: normal; opacity: .5; }
.f-links [data-fact] { cursor: pointer; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35); text-underline-offset: 5px; }
.f-links [data-fact]:hover { text-decoration-color: #fff; }
.f-btns { display: flex; gap: 14px; margin-top: 22px; }
.f-btns button { border: 0; border-radius: 999px; padding: 16px 30px; font-size: 22px; font-weight: 800; background: #fff; color: #111; }
.f-btns button.ghost { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.f-btns button:hover { filter: brightness(1.08); }
#fakeplayer { inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(80% 70% at 50% 40%, #3a2f5c, #0d0c14); }
#fakeplayer.open { display: flex; }
.fp-label { font-size: 12px; letter-spacing: .2em; opacity: .5; }
.fp-title { font-family: "Noto Serif JP", serif; font-size: 34px; font-weight: 700; }
#fpClose { margin-top: 18px; border: 1px solid rgba(255,255,255,.25); background: none; border-radius: 999px; padding: 8px 18px; }
/* 键盘聚焦 = .lattice-poster.is-focused（Lattice.css 139-189）：
   - 环是「发丝线 + 4px 主色环 + 发丝线」再叠抬升投影，画在海报自身外侧。原型的环在内层上，所以聚焦时要解除外框的
     paint containment，否则外扩的环被裁掉（Lattice 把环画在被 contain 的元素自身上，不受影响）。
   - 正在播放的卡已经有强调色描边，不叠第二道环，只加强内发光。
   - 顶部 10% 白色渐变高光（.lattice-poster::after）。原型里 ::after 被批量勾标占用，放到 .shade::before。 */
.tile.is-kbfocus { z-index: 4; contain: layout; }
.is-kbfocus .tint { opacity: 0; }
.is-kbfocus:not(.is-playing) .tile-inner { box-shadow: 0 0 0 1px rgb(0 0 0 / 62%), 0 0 0 4px var(--text-primary), 0 0 0 5px rgb(0 0 0 / 38%), var(--lattice-poster-elevation, var(--lattice-focus-lift)); }
:root.is-daylight .is-kbfocus:not(.is-playing) .tile-inner { box-shadow: 0 0 0 1px rgb(255 255 255 / 78%), 0 0 0 4px var(--text-primary), 0 0 0 5px rgb(255 255 255 / 45%), var(--lattice-poster-elevation, var(--lattice-focus-lift)); }
.is-kbfocus.is-playing .tile-inner { box-shadow: var(--lattice-poster-elevation, var(--lattice-focus-lift)); }
.is-kbfocus.is-playing .tile-inner::before { box-shadow: inset 0 0 0 1px rgb(var(--lattice-shade-rgb) / 62%), inset 0 0 26px -6px color-mix(in srgb, var(--text-accent) 62%, transparent); }
.shade::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s ease;
    background: linear-gradient(180deg, rgb(255 255 255 / 10%), transparent 60%); }
.is-kbfocus .shade::before { opacity: 1; }
#stage:focus { outline: none; }
#seam button:focus-visible, #seam [data-tab]:focus-visible, #seam select:focus-visible { outline: 2px solid var(--text-accent); outline-offset: 2px; }
#kbToast { left: 50%; top: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700;
    background: rgb(0 0 0 / 55%); backdrop-filter: blur(16px); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 45; }
#kbToast.show { opacity: 1; }
#palette { inset: 0; z-index: 60; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; background: rgb(0 0 0 / 30%); }
#palette.open { display: flex; }
.pal-box { width: min(560px, calc(100vw - 32px)); border-radius: 20px; padding: 10px; background: rgb(20 20 22 / 88%); border: 1px solid rgb(255 255 255 / 8%);
    backdrop-filter: blur(24px); box-shadow: 0 24px 64px rgb(0 0 0 / 50%); color: #f4f4f5; }
#palInput { width: 100%; border: 0; background: transparent; color: inherit; font: inherit; font-size: 16px; padding: 10px 12px; outline: none; }
#palList { max-height: 50vh; overflow: auto; }
.pal-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; font-size: 13px; cursor: pointer; }
.pal-row.on { background: rgb(255 255 255 / 10%); }
.pal-scope { font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 2px 6px; border-radius: 6px; background: rgb(255 255 255 / 10%); opacity: .8; }
.pal-label { font-weight: 700; }
.pal-id { margin-left: auto; font-size: 11px; opacity: .4; font-family: ui-monospace, monospace; }
.pal-row kbd { font-size: 11px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 6px; opacity: .5; font-family: inherit; }
.pal-empty, .pal-foot { font-size: 11px; opacity: .45; padding: 8px 12px; }
.kb-help { font-size: 11px; line-height: 1.8; opacity: .75; }
.kb-help kbd { font-family: inherit; font-size: 10px; padding: 0 5px; border: 1px solid color-mix(in srgb, currentColor 40%, transparent); border-radius: 5px; }
#hud { left: 16px; bottom: 14px; font-size: 11px; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; pointer-events: none; }
#now { right: 76px; bottom: 20px; display: none; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px;
    background: rgba(20,20,22,.78); backdrop-filter: blur(10px); font-size: 12px; max-width: 360px; }
#now .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
#now .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#now button { border: 0; border-radius: 999px; background: rgba(255,255,255,.12); padding: 6px 12px; font-size: 12px; font-weight: 700; flex: none; }
#opts-btn { right: 20px; bottom: 20px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(20,20,22,.78);
    backdrop-filter: blur(10px); font-size: 18px; }
#opts { right: 20px; bottom: 74px; width: 300px; padding: 14px 16px; border-radius: 12px; background: rgba(20,20,22,.92);
    backdrop-filter: blur(14px); font-size: 12px; display: none; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
#opts.open { display: block; }
#opts h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .1em; color: rgba(255,255,255,.5); font-weight: 700; }
#opts h4:first-child { margin-top: 0; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1px solid rgba(255,255,255,.14); background: none; border-radius: 6px; padding: 5px 9px; font-size: 12px; }
.seg button.on { background: #fff; color: #111; border-color: #fff; }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.45)); }
/* ═════════ 对齐 folia Lattice 设计风格（以下规则覆盖上面的原型样式） ═════════
   主题变量与 buildAppStyle 一致：--bg-color / --text-primary / --text-secondary / --text-accent；
   派生量与 Lattice.css 的 .lattice-root 一致。 */
:root {
    --bg-color: #09090b; --text-primary: #f4f4f5; --text-secondary: #71717a; --text-accent: #f4f4f5;
    --lattice-poster-ink: var(--text-primary);
    --lattice-shade-rgb: 0 0 0;
    --lattice-poster-background: color-mix(in srgb, var(--bg-color) 88%, var(--lattice-poster-ink));
    --lattice-expanded-shadow: rgb(0 0 0 / 74%);
    --lattice-chrome-shadow: rgb(0 0 0 / 55%);
    --lattice-focus-lift: 0 12px 32px rgb(0 0 0 / 45%);
    --lattice-poster-tint-effective-opacity: .5;
    --accent: var(--text-accent);
    --accent-ink: var(--bg-color);
}
:root.is-daylight {
    --lattice-shade-rgb: 255 255 255;
    --lattice-poster-background: color-mix(in srgb, var(--bg-color) 94%, var(--lattice-poster-ink));
    --lattice-expanded-shadow: rgb(0 0 0 / 25%);
    --lattice-chrome-shadow: rgb(255 255 255 / 55%);
    --lattice-focus-lift: 0 12px 32px rgb(0 0 0 / 25%);
    --lattice-poster-tint-effective-opacity: .36;
}
html, body { font-family: Inter, "Noto Sans JP", system-ui, sans-serif; color: var(--text-primary);
    background:
        radial-gradient(circle at 14% 12%, color-mix(in srgb, var(--text-accent) 16%, transparent), transparent 29%),
        radial-gradient(circle at 86% 82%, color-mix(in srgb, var(--text-secondary) 20%, transparent), transparent 32%),
        var(--bg-color); }
/* 颗粒 + 浅暗角（Lattice: ::after 噪点 soft-light .13；has-vignette 78% → 52%） */
.vignette { z-index: 4; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 78%, rgba(0,0,0,.52) 100%); }
:root.is-daylight .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 78%, rgba(0,0,0,.16) 100%); }
.vignette::after { content: ''; position: absolute; inset: 0; opacity: .13; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); }
:root.is-daylight .vignette::after { opacity: .07; }

/* 海报：直角、主题底色、底部压暗、主题染色压住背景卡 */
.tile { transition: z-index 0s; }
.tile:not(.is-wall):hover { z-index: 3; }
.tile-inner { border-radius: 0; color: var(--lattice-poster-ink); background: var(--lattice-poster-background);
    box-shadow: var(--lattice-poster-elevation, 0 12px 32px transparent); transition: box-shadow .6s ease, filter .6s ease, opacity .3s, transform .2s ease; }
.tile:not(.is-wall):hover .tile-inner { filter: saturate(1.08) brightness(1.05); transform: scale(var(--hsx, 1), var(--hsy, 1)); }

<script>
'use strict';

/* ───────────── 假数据 ───────────── */

// 带种子的伪随机，保证每次打开数据一致
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261005);
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const WA = ['光', '夜明け', '青い', '硝子', '月下', '雨上がり', '白昼', '星屑', '花', '透明', '残響', '海辺', '微熱', '秒針', '銀河', '向日葵', '蜃気楼', '午前零時', '一世', '童話'];
const WB = ['の劇場', 'のワルツ', '少女', 'フィルム', 'ロケット', 'アンサー', 'の行方', 'ノスタルジア', 'シグナル', 'パレード', 'の庭', 'ランデブー', 'ステラ', 'メモリー', 'トワイライト', '風靡'];
const EN = ['Henceforth', 'Digital Girl', 'Parallel', 'Afterglow', 'Monochrome', 'Satellite', 'Lumen', 'Overture', 'Static', 'Polaris', 'Grokmas', 'Stallone'];
const songTitle = () => rnd() < .72 ? pick(WA) + pick(WB) : pick(EN) + (rnd() < .3 ? ' (Cover)' : '');
const ARTISTS = [
    ['花鳥', 'Kachō'], ['夜野ミナト', 'Yoruno Minato'], ['結城あおい', 'Yūki Aoi'], ['青海', 'Seikai'], ['霧島レイ', 'Kirishima Rei'],
    ['Skyline', 'Skyline'], ['白昼夢', 'Hakuchūmu'], ['柊', 'Hiiragi'], ['透明少女', 'Tōmei Shōjo'], ['朝凪', 'Asanagi'],
    ['月下美人', 'Gekka Bijin'], ['Nova', 'Nova'],
];
let trackSeq = 0;
const allTracks = [], allAlbums = [], allArtists = [];
ARTISTS.forEach(([name, roman], ai) => {
    const artist = { key: 'r:' + ai, kind: 'artist', title: name, roman, hue: Math.floor(rnd() * 360), albums: [], tracks: [],
        bio: `${name}（${roman}）是一位以${pick(['合成器', '钢琴', '吉他', '弦乐'])}与${pick(['城市夜景', '童话意象', '季节感', '电子噪音'])}为核心的创作者。出道以来发表 ${2 + Math.floor(rnd() * 3)} 张专辑，作品常出现在${pick(['动画', '游戏', '广播剧'])}的片尾。` };
    allArtists.push(artist);
    const albumCount = 2 + Math.floor(rnd() * 2);
    for (let b = 0; b < albumCount; b++) {
        const album = { key: `a:${ai}:${b}`, kind: 'album', title: rnd() < .5 ? pick(WA) + pick(WB) : pick(EN), artist: name, artistKey: artist.key,
            hue: (artist.hue + b * 37) % 360, tracks: [] };
        const n = 4 + Math.floor(rnd() * 9);
        for (let i = 0; i < n; i++) {
            const t = { key: 't:' + (trackSeq++), kind: 'track', title: songTitle(), artist: name, artistKey: artist.key, album: album.title,
                hue: (album.hue + i * 9) % 360, dur: 150 + Math.floor(rnd() * 150) };
            album.tracks.push(t); artist.tracks.push(t); allTracks.push(t);
        }
        artist.albums.push(album); allAlbums.push(album);
    }
});
// 刻意放 3 首「灯台」，用来测试「结果很少」
['灯台守', '灯台と少女', '灯台の夜'].forEach((title, i) => {
    const artist = allArtists[i * 4];
    const t = { key: 't:' + (trackSeq++), kind: 'track', title, artist: artist.title, artistKey: artist.key, album: artist.albums[0].title,
        hue: 40 + i * 20, dur: 200 };
    artist.albums[0].tracks.push(t); artist.tracks.push(t); allTracks.push(t);
});
// 本地曲库：前 72 首挂到两个根目录下，按 根/歌手/专辑 三层组织，供「本地」tab 和目录树使用
const LOCAL_ROOTS = ['D:/Music', 'E:/Anime OST'];
const localTracks = allTracks.slice(0, 72).map((t, i) => ({ ...t, key: 'l' + t.key, local: true,
    path: `${LOCAL_ROOTS[i % 2]}/${t.artist}/${t.album}` }));
// 由路径建目录树：节点 {id, name, path, children, trackKeys(含子树)}
function buildFolderTree(tracks) {
    const roots = [];
    const byPath = new Map();
    for (const t of tracks) {
        const parts = t.path.split('/');
        const rootName = parts.slice(0, 2).join('/');
        let path = rootName, parent = null;
        const chain = [rootName, ...parts.slice(2)];
        chain.forEach((name, depth) => {
            if (depth > 0) path += '/' + name;
            let node = byPath.get(path);
            if (!node) {
                node = { id: path, name, path, depth, children: [], trackKeys: [] };
                byPath.set(path, node);
                (parent ? parent.children : roots).push(node);
            }
            node.trackKeys.push(t.key);
            parent = node;
        });
    }
    return roots;
}
const localTree = buildFolderTree(localTracks);
// 叶子目录（专辑级）作为墙上的文件夹卡片；目录树节点记录其子树下的文件夹卡片 key（勾选单位是文件夹，和 GridMap 一致）
const localFolders = [];
(function collectFolders(nodes) {
    for (const node of nodes) {
        if (!node.children.length) {
            const tracks = localTracks.filter(t => t.path === node.path);
            localFolders.push({ key: 'f:' + node.path, kind: 'folder', title: node.name, artist: node.path.split('/').slice(-2, -1)[0],
                album: node.path, path: node.path, hue: tracks[0].hue, tracks });
        }
        collectFolders(node.children);
    }
})(localTree);
(function attachFolderKeys(nodes) {
    for (const node of nodes) {
        attachFolderKeys(node.children);
        node.folderKeys = localFolders.filter(f => f.path === node.path || f.path.startsWith(node.path + '/')).map(f => f.key);
    }
})(localTree);

function getBlock(bx, by) {
    const k = bx + ',' + by;
    let slots = blockCache.get(k);
    if (slots) return slots;
    const o = hash2(bx, by) % 4;
    slots = TEMPLATES[mod(bx + 2 * by, TEMPLATES.length)].map(([x, y, c, r], s) => {
        if (o & 1) x = BCOLS - x - c;
        if (o & 2) y = BROWS - y - r;
        const wx = bx * BW + x * P, wy = by * BH + y * P, w = c * P - GAP, h = r * P - GAP;
        return { key: `${bx},${by},${s}`, bx, by, s, x: wx, y: wy, w, h, cx: wx + w / 2, cy: wy + h / 2, area: c * r };

function wrapIndex(slot, n) {

    const px = Math.max(1, Math.round(Math.sqrt(blocks * 2.2)));

    return mod((mod(slot.by, py) * px + mod(slot.bx, px)) * 12 + slot.s, n);

    if (e.key === 'PageDown' || e.key === 'PageUp') {
        e.preventDefault();
        tweenCam({ x: state.cam.x, y: state.cam.y + (e.key === 'PageDown' ? 1 : -1) * state.vh * .85 / state.scale }, 380).then(settleCamera);
        return;
    }
    if (e.key === 'F6' && cur().kind === 'home') {
        e.preventDefault();
        const tabs = ['playlist', 'album', 'artist', 'local'];
        switchTab(tabs[mod(tabs.indexOf(homeTab) + (e.shiftKey ? -1 : 1), tabs.length)]);
        kbKey = null;
        return;
    }
    if (e.key === 'Insert' && isBatchMode()) {
        e.preventDefault();
        const rec = kbRec();
        if (rec && rec.item) { toggleSelection([rec.item.key], !state.selected.has(rec.item.key)); const nx = findAdjacent(rec.slot, 'ArrowDown'); if (nx) setKb(nx); }
        return;
    }
    if (e.key === 'Delete' && isBatchMode() && state.selected.size) {
        e.preventDefault();
        if (confirm(`（原型）从曲库移除所选 ${selectedTracks().length} 首？`)) selectionAction('sel-remove');
        return;
    }
    // 可打印字符：可过滤页面 → 打开过滤框；首页 → s 打开 palette（模拟 useCommandPalette 的分发顺序）
    if (e.key.length === 1 && e.key !== ' ') {
        if (hasFilterSurface()) { e.preventDefault(); openFilterWith(e.key); return; }
        if (e.key.toLowerCase() === 's') { e.preventDefault(); openPalette(); return; }
        if (e.key === ':') { e.preventDefault(); openPalette(':'); return; }
    }
});

/* ═════════ 模拟 command palette：展示「suite 外观动作」（§8.3 第 4 条）生成的命令 ═════════ */
let palOpen = false, palIndex = 0;
// 当前 suite 注册的外观动作（LibrarySuiteChromeAction 的原型版）：id 带 bravais- 前缀，执行键在同时可用的命令间无前缀冲突
function chromeActions() {
    const layer = cur(), hasSeam = layer.seamFull > 0 && layer.kind !== 'queue';
    return [
        { id: 'bravais-seam-full', label: '展开信息条', kw: 'seam expand xinxitiao', key: null, ok: hasSeam && state.seamLevel !== 'full', run: () => setSeamLevel('full') },
        { id: 'bravais-seam-spine', label: '收起信息条（书脊）', kw: 'collapse spine shouqi shuji', key: null, ok: hasSeam && state.seamLevel !== 'spine' && !layer.forceFull, run: () => setSeamLevel('spine') },
        { id: 'bravais-seam-hide', label: '折叠信息条', kw: 'fold hide zhedie', key: null, ok: hasSeam && state.seamLevel !== 'hidden', run: () => setSeamLevel('hidden') },
        { id: 'bravais-seam-here', label: '在这里裂开缝', kw: 'reopen here liekai', key: null, ok: seamCollapsed(), run: () => reopenSeamHere() },
        { id: 'bravais-panel', label: panelKind(layer) === 'tree' ? '打开目录' : '打开列表', kw: 'panel list tree liebiao mulu', key: 'l', ok: !!panelKind(layer) && !layer.panelOpen, run: () => openPanel() },
        { id: 'bravais-focus-current', label: '定位正在播放', kw: 'focus current now playing dingwei', key: 'c', ok: !!state.nowKey, run: () => locateNowPlaying() },
    ].filter(a => a.ok);
}
// 页面自身注册的资料命令（grid-surface / artist-surface / directory-surface 的代表），只为展示混排效果
function surfaceCommands() {
    const layer = cur(), out = [];
    if (layer.kind === 'collection' || layer.kind === 'artist') {
        out.push({ id: 'grid-play-all', label: '播放全部', kw: 'play all', key: null, run: () => { const tr = layerItems(layer).filter(i => i.kind === 'track'); if (tr[0]) play(tr[0]); } });
        out.push({ id: 'filter-view', label: '过滤当前视图', kw: 'filter guolv', key: null, hot: 'Ctrl+F', run: () => openFilterWith('') });
    }
    if (isBatchMode()) out.push({ id: 'directory-select-all', label: '全选文件夹', kw: 'select all', key: null, hot: 'Ctrl+A', run: () => toggleSelection(localFolders.filter(f => !f.virtual).map(f => f.key), true) });
    out.push({ id: 'navigate-lattice', label: '进入 Lattice', kw: 'lattice queue', key: 'w', hot: 'Ctrl+B', run: () => openQueue() });
    return out;
}
function locateNowPlaying() {
    let best = null, bd = Infinity;
    const p = { x: seamWorldX(), y: state.cam.y };
    const abx = Math.floor(p.x / BW), aby = Math.floor(p.y / BH);
    for (let bx = abx - 4; bx <= abx + 4; bx++) for (let by = aby - 4; by <= aby + 4; by++) for (const sl of getBlock(bx, by)) {
        const it = contentFor(sl);
        if (!it || it.key !== state.nowKey) continue;
        const d = Math.hypot(sl.cx - p.x, sl.cy - p.y);
        if (d < bd) { bd = d; best = sl; }
    }
    if (best) setKb(best); else flashKb('正在播放的歌不在这一层');
}
function palCommands() {
    const q = $('palInput').value.trim();
    const all = [...chromeActions().map(a => ({ ...a, scope: 'suite-chrome' })), ...surfaceCommands().map(a => ({ ...a, scope: 'surface' }))];
    if (q.startsWith(':')) return all.filter(a => a.key && a.key.startsWith(q.slice(1)));
    if (!q) return all;
    return all.filter(a => (a.label + ' ' + a.kw + ' ' + a.id).toLowerCase().includes(q.toLowerCase()));
}
function renderPalette() {
    const list = palCommands();
    palIndex = Math.max(0, Math.min(palIndex, list.length - 1));
    $('palList').innerHTML = list.map((a, i) => `<div class="pal-row ${i === palIndex ? 'on' : ''}" data-i="${i}">
        <span class="pal-scope">${a.scope === 'suite-chrome' ? 'bravais' : '页面'}</span><span class="pal-label">${a.label}</span>
        <span class="pal-id">${a.id}</span>${a.key ? `<kbd>: ${a.key}</kbd>` : ''}${a.hot ? `<kbd>${a.hot}</kbd>` : ''}</div>`).join('') || '<div class="pal-empty">没有匹配的命令</div>';
    // 执行模式：「:」+ 执行键唯一命中时立即执行
    const q = $('palInput').value.trim();
    if (q.startsWith(':') && q.length > 1 && list.length === 1 && list[0].key === q.slice(1)) runPal(list[0]);
}
function runPal(a) { closePalette(); a.run(); }
function openPalette(initial = '') {
    palOpen = true; palIndex = 0;
    $('palette').classList.add('open');
    $('palInput').value = initial;
    renderPalette();
    $('palInput').focus();
}
function closePalette() { palOpen = false; $('palette').classList.remove('open'); stage.focus({ preventScroll: true }); }
$('palInput').addEventListener('input', () => { palIndex = 0; renderPalette(); });
$('palInput').addEventListener('keydown', e => {
    const list = palCommands();
    if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = Math.min(list.length - 1, palIndex + 1); renderPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = Math.max(0, palIndex - 1); renderPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (list[palIndex]) runPal(list[palIndex]); }
});
$('palList').addEventListener('click', e => { const row = e.target.closest('.pal-row'); if (row) runPal(palCommands()[+row.dataset.i]); });
$('palette').addEventListener('click', e => { if (e.target.id === 'palette') closePalette(); });

addEventListener('resize', () => {
    const wasNarrow = isNarrow();
    state.vw = innerWidth; state.vh = innerHeight;
    // 跨过窄屏阈值时，非隐藏的等级回到该宽度下的默认值
    if (wasNarrow !== isNarrow() && cur()) {
        if (state.seamLevel !== 'hidden') state.seamLevel = isNarrow() ? 'spine' : 'full';
        renderSeam();
        tweenSeam(cur().seamTarget, 300);
    }
    state.scale = getLatticeScale(state.vw);
    dirty = true;
});

/* ───────────── 启动 ───────────── */

state.scale = getLatticeScale(state.vw);
applyTheme();
state.seamLevel = state.seamRestore = isNarrow() ? 'spine' : 'full';
state.stack.push(homeLayer(homeTab));
cur().anchor = { x: state.cam.x, y: state.cam.y };
renderSeam();
renderOpts();
updateChrome();
requestAnimationFrame(t => {
    lastT = t;
    applyTransforms();
    cull();
    swapWall();
    tweenSeam(cur().seamTarget, 520);
    requestAnimationFrame(frame);
});
</script>
</body>
</html>
